function dpost(x){const im=pimgs(x).map(simg).filter(Boolean);return'<div class="dpost">'+(im.length?'<div class="dthumbs">'+im.map(u=>'<img class="dthumb" src="'+u+'" loading="lazy">').join('')+(im.length>1?'<span class="nph">'+im.length+'장</span>':'')+'</div>':'')+'<div class="dpc">'+esc(x.content||'(사진)')+'</div><div class="dpmeta">'+(x.location?esc(x.location)+' · ':'')+(x.like_count!=null?'좋아요 '+x.like_count+' · ':'')+rel(x.created_at)+' 전</div></div>'}
function kpi(b,l,sub){return'<div class="kpi"><b>'+b+'</b><span>'+l+'</span>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'}
// SVG 막대 (일자/시간대)
function bars(data,keys,colors,labelIdx){
  const n=data.length,W=100,H=40,bw=W/n,max=Math.max(1,...data.map(d=>keys.reduce((a,k)=>a+(d[k]||0),0)));
  let g='';
  data.forEach((d,i)=>{let y=H,x=i*bw+bw*0.12,w=bw*0.76;
    g+='<rect class="bar-bg" x="'+x.toFixed(2)+'" y="0" width="'+w.toFixed(2)+'" height="'+H+'" rx="0.5" fill="#e5e7eb"/>';
    keys.forEach((k,ki)=>{const h=((d[k]||0)/max)*H;if(h>0){y-=h;g+='<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+w.toFixed(2)+'" height="'+h.toFixed(2)+'" fill="'+colors[ki]+'"><title>'+(d.label||d.date||d.hour)+' '+k+':'+d[k]+'</title></rect>'}});
  });
  let ax='';(labelIdx||[]).forEach(i=>{ax+='<span>'+(data[i].label!=null?data[i].label:(data[i].hour!=null?data[i].hour+'시':data[i].date))+'</span>'});
  return'<svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:70px;display:block">'+g+'</svg><div class="muted" style="display:flex;justify-content:space-between;font-size:10px;margin-top:2px">'+ax+'</div>';
}
function chartCard(title,sub,svg){return'<div class="chart"><div class="ct"><span>'+title+'</span><em>'+sub+'</em></div>'+svg+'</div>'}
function tbl(head,rows){return'<div class="scroll"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}

function analytics(d){
  const s=d.stats;
  let h='<div class="kpis">'
    +kpi(N(s.users),'유저',s.newUsers7d?('+'+s.newUsers7d+' 신규(7일)'):'')

    +kpi(N(s.postsTotal),'게시물','오늘 '+s.postsToday)
    +kpi(N(s.dmsUser),'DM 발신','받음 '+N(s.dmsPersona))
    +kpi(N(s.likes),'좋아요')+kpi(N(s.matches),'매칭')
    +kpi(N(s.relationships),'관계','팔로우 '+s.follows)
    +kpi(N(s.aiCallsToday),'AI콜 오늘','7일 '+N(s.aiCalls7d))
    +kpi(D(s.aiCostToday),'AI비용 오늘','총 '+D(s.aiCostTotal))

  f.forEach((st,i)=>{const prev=i>0?f[i-1].count:st.count;const conv=prev?Math.round(st.count/prev*100):100;const drop=prev-st.count;
    h+='<div class="fn"><div class="lab">'+esc(st.stage)+'</div><div class="track"><div class="fill" style="width:'+(st.count/fmax*100)+'%"></div><div class="fc">'+N(st.count)+(i>0?' · '+conv+'%':'')+'</div></div><div class="drop">'+(i>0&&drop>0?'▼'+drop+'명 이탈':'')+'</div></div>';
  });
  h+='</div>';
  // 리텐션

  h+='<div class="panel"><h2>리텐션</h2><div class="rets">'
    +'<div class="ret"><b>'+r.dau+'</b><span>DAU (오늘 활성)</span></div>'
    +'<div class="ret"><b>'+r.wau+'</b><span>WAU (7일)</span></div>'

    +'<div class="ret"><b>'+r.returningRate+'%</b><span>재방문율(2일+)</span></div>'
    +'<div class="ret warn"><b>'+r.churnRate+'%</b><span>이탈률(7일+ 무활동)</span></div>'
    +'</div></div>';
  // 시간대별 + 14일추이
  const hr=d.hourly||[],peak=hr.reduce((a,b)=>((b.posts+b.dms+b.swipes)>(a.posts+a.dms+a.swipes)?b:a),hr[0]||{});
  hr.forEach(x=>x.label=(x.hour%6===0||x.hour===23)?x.hour:'');
  h+='<div class="panel"><h2>시간대별 활동 (KST)</h2>'
    +chartCard('게시물·DM·스와이프','피크 '+(peak?peak.hour+'시':'-'),bars(hr,['dms','posts','swipes'],['#2e8b57','#2f6feb','#b7791f'],[0,6,12,18,23]))
    +'<div class="muted" style="font-size:11px;margin-top:6px"><span class="sw" style="background:#2e8b57"></span>DM · <span class="sw" style="background:#2f6feb"></span>게시물 · <span class="sw" style="background:#b7791f"></span>스와이프</div></div>';
  const tl=d.timeline||[];tl.forEach(x=>x.label='');
  h+='<div class="panel"><h2>일자별 추이 (14일)</h2><div class="charts">'
    +chartCard('게시물','합 '+tl.reduce((a,x)=>a+x.posts,0),bars(tl,['posts'],['#2f6feb'],[0,13]))
    +chartCard('DM','합 '+tl.reduce((a,x)=>a+x.dms,0),bars(tl,['dms'],['#2e8b57'],[0,13]))
    +chartCard('AI','합 '+tl.reduce((a,x)=>a+x.ai,0),bars(tl,['ai'],['#b7791f'],[0,13]))
    +'</div></div>';
  // 기능별 사용량
  const fu=d.featureUsage||[],fumax=Math.max(1,...fu.map(x=>x.count));
  h+='<div class="panel"><h2>기능별 사용량</h2>'+tbl('<th>기능</th><th class="n">횟수</th><th style="width:45%">비중</th>',
    fu.map(x=>'<tr><td>'+esc(x.feature)+'</td><td class="n">'+N(x.count)+'</td><td><span class="ibar" style="width:'+(x.count/fumax*100)+'%"></span></td></tr>').join(''))+'</div>';
  // AI 비용(함수별)
  const ac=d.aiCost||[],tot=ac.reduce((a,x)=>({calls:a.calls+x.calls,in_tokens:a.in_tokens+x.in_tokens,out_tokens:a.out_tokens+x.out_tokens,cached_tokens:a.cached_tokens+x.cached_tokens,cost:a.cost+x.cost}),{calls:0,in_tokens:0,out_tokens:0,cached_tokens:0,cost:0});
  h+='<div class="panel"><h2>AI 비용 (함수별)</h2>'+tbl('<th>함수</th><th class="n">호출</th><th class="n">입력토큰</th><th class="n">출력토큰</th><th class="n">캐시</th><th class="n">비용</th>',
    ac.map(x=>'<tr><td>'+esc(x.fn)+'</td><td class="n">'+N(x.calls)+'</td><td class="n">'+N(x.in_tokens)+'</td><td class="n">'+N(x.out_tokens)+'</td><td class="n">'+N(x.cached_tokens)+'</td><td class="n">'+D(x.cost)+'</td></tr>').join('')
    +'<tr style="font-weight:700"><td>합계</td><td class="n">'+N(tot.calls)+'</td><td class="n">'+N(tot.in_tokens)+'</td><td class="n">'+N(tot.out_tokens)+'</td><td class="n">'+N(tot.cached_tokens)+'</td><td class="n">'+D(tot.cost)+'</td></tr>')+'</div>';
  // 이벤트 스트림
  const bc={post:'#2f6feb',comment:'#2e8b57',dm_user:'#6b7280',dm_persona:'#6b7280',match:'#7857c9'};
  const bl={post:'게시물',comment:'댓글',dm_user:'DM유저',dm_persona:'DM봇',match:'매칭'};
  h+='<div class="panel"><h2>이벤트 스트림</h2>'+(d.events||[]).map(e=>'<div class="ev"><span class="badge" style="background:'+(bc[e.type]||'#667085')+'">'+(bl[e.type]||e.type)+'</span><span class="who">'+esc(e.who)+'</span><span class="tx">'+esc(e.text)+'</span><span class="tm">'+rel(e.at)+'</span></div>').join('')+'</div>';
  return h;
}
function postsTab(d){return(d.posts||[]).length?d.posts.map(p=>{const im=(p.media_urls||[]).map(simg).filter(Boolean);return'<div class="card"><div class="phead"><b>'+esc(p.author)+'</b><span class="t">'+rel(p.created_at)+' 전</span></div>'+(im.length?'<div class="thumbs">'+im.map(u=>'<img class="thumb" src="'+u+'" loading="lazy">').join('')+'</div>':'')+(p.content?'<div class="content">'+esc(p.content)+'</div>':'')+(p.media_type==='poll'?'<div class="muted">투표</div>':'')+'</div>'}).join(''):'<p class="muted">게시물 없음</p>'}

  (d.users||[]).map(u=>'<tr class="clk" onclick="drill(\'user\',\''+u.id+'\')"><td>'+esc(u.nickname||'-')+'</td><td class="muted">'+esc(u.email||'-')+'</td><td class="n">'+u.posts+'</td><td class="n">'+u.dms+'</td><td class="n">'+u.ai_today+'</td><td class="n">'+u.followers+'</td><td>'+rel(u.last_active)+'</td></tr>').join(''))+'<p class="muted" style="margin:8px 2px 0">행을 누르면 상세 →</p></div>'}

let PF={gender:'all',nat:'all',sort:'rating',type:'all'};
const NAT_LABEL={korean:'🇰🇷 한국',japanese:'🇯🇵 일본',chinese:'🇨🇳 중국',western:'🇺🇸 서구',all:'전체'};
const GEN_LABEL={female:'여성',male:'남성',all:'전체'};
function setPF(k,v){PF[k]=v;if(LAST)render(LAST)}
function seg(label,cur,opts,key){return'<div class="seg"><span class="segl">'+label+'</span>'+opts.map(o=>'<button class="segb'+(cur===o.v?' on':'')+'" onclick="setPF(\''+key+'\',\''+o.v+'\')">'+esc(o.l)+'</button>').join('')+'</div>'}
function personasTab(d){
  let list=(d.personas||[]).slice();
  if(PF.type==='anime')list=list.filter(p=>p.style==='anime');
  else if(PF.type==='real')list=list.filter(p=>p.style!=='anime');
  if(PF.gender!=='all')list=list.filter(p=>(p.gender||'')===PF.gender);
  if(PF.type!=='anime'&&PF.nat!=='all')list=list.filter(p=>(p.nationality||'')===PF.nat);
  if(PF.sort==='rating')list.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(PF.sort==='users')list.sort((a,b)=>(b.rel_users||0)-(a.rel_users||0));
  else if(PF.sort==='posts')list.sort((a,b)=>(b.post_count||0)-(a.post_count||0));
  else list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const bar='<div class="fbar">'
    +seg('유형',PF.type,[{v:'all',l:'전체'},{v:'real',l:'실사'},{v:'anime',l:'🎨 애니'}],'type')
    +seg('성별',PF.gender,[{v:'all',l:'전체'},{v:'female',l:'여성'},{v:'male',l:'남성'}],'gender')
    +(PF.type!=='anime'?seg('국적',PF.nat,[{v:'all',l:'전체'},{v:'korean',l:'🇰🇷 한국'},{v:'japanese',l:'🇯🇵 일본'},{v:'chinese',l:'🇨🇳 중국'},{v:'western',l:'🇺🇸 서구'}],'nat'):'')
    +seg('정렬',PF.sort,[{v:'rating',l:'평점순'},{v:'users',l:'인기순'},{v:'posts',l:'게시물순'},{v:'name',l:'이름순'}],'sort')
    +'<span class="fcount">'+list.length+'명</span></div>';
  const cards=list.map(p=>{const posts=(p.recent_posts||[]).filter(x=>x.image_url||x.content);
  const meta='<div class="pmeta">'
    +(p.style==='anime'?'<span class="tag2">🎨 애니'+(p.genre?' · '+esc(p.genre):'')+'</span>':'')
    +(p.gender?'<span class="tag2">'+GEN_LABEL[p.gender]+'</span>':'')
    +(p.style!=='anime'&&p.nationality?'<span class="tag2">'+(NAT_LABEL[p.nationality]||p.nationality)+'</span>':'')
    +'<span class="tag2">관계 '+(p.rel_users||0)+'</span>'
    +'<span class="tag2">호감 '+(p.avg_score||0)+'</span>'
    +'<span class="tag2">평점 '+(p.rating||0)+'</span></div>';
  return'<div class="card clk" onclick="drill(\'persona\',\''+p.id+'\')"><div class="phead"><b>'+esc(p.name)+'</b> <span class="muted">@'+esc(p.handle||'')+'</span><span class="t">게시물 '+(p.post_count||0)+'</span></div>'
    +meta
    +gal(p.image,p.photos)
    +(p.bio?'<div class="pbio">'+esc(p.bio)+'</div>':'')
    +(p.facts?'<div class="pfacts"><b>설정</b>'+esc(p.facts)+'</div>':'')
    +(p.face?'<div class="pface"><b>외모앵커</b>'+esc(p.face)+'</div>':'')
    +(posts.length?'<div class="pfeed">'+posts.map(x=>{const im=pimgs(x).map(simg).filter(Boolean);return'<div class="pf">'+(im.length?'<div style="position:relative"><img class="pfimg" src="'+im[0]+'" loading="lazy">'+(im.length>1?'<span class="nph">'+im.length+'장</span>':'')+'</div>':'')+'<div class="pfx"><div class="pfc">'+esc((x.content||'').slice(0,60))+'</div>'+(x.location?'<div class="ploc">'+esc(x.location)+'</div>':'')+'</div></div>'}).join('')+'</div>':'')
    +'</div>';}).join('')||'<p class="muted">조건에 맞는 페르소나가 없어요.</p>';
  return bar+cards;
}

async function drill(kind,id){
  modalOpen=true;
  document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal" onclick="if(event.target.id==\'modal\')closeModal()"><div class="modal-box"><button class="mx" onclick="closeModal()">×</button><p class="muted">불러오는 중…</p></div></div>');
  try{const d=await api({view:kind,id});document.querySelector('#modal .modal-box').innerHTML='<button class="mx" onclick="closeModal()">×</button>'+(kind==='user'?userModal(d):personaModal(d));}
  catch(e){document.querySelector('#modal .modal-box').innerHTML='<button class="mx" onclick="closeModal()">×</button><p class="err">불러오기 실패</p>'}
}

function setSql(v){SQLTEXT=v}
async function runSql(){if(SQL_BUSY)return;const q=(SQLTEXT||'').trim();if(!q)return;
  SQL_BUSY=true;SORT_COL=null;if(LAST)render(LAST);
  try{SQLRES=await api({action:'sql',sql:q,limit:1000})}catch(e){SQLRES={error:String(e)}}
  SQL_BUSY=false;if(LAST)render(LAST);}
function quick(i){SQLTEXT=QUICK[i].q;SEL_TABLE='';runSql()}
function sortBy(c){if(SORT_COL===c){SORT_DIR=-SORT_DIR}else{SORT_COL=c;SORT_DIR=1}render(LAST)}
function cellStr(v){if(v===null||v===undefined)return null;if(typeof v==='object')return JSON.stringify(v);return String(v)}
function grid(res){
  if(res.error)return'<p class="err">'+esc(res.error)+'</p>';
  const cols=res.columns||[];let rows=(res.rows||[]).slice();
  if(!rows.length)return'<p class="muted">결과가 없어요.</p>';
  if(SORT_COL){rows.sort((a,b)=>{const x=a[SORT_COL],y=b[SORT_COL];if(x===y)return 0;if(x===null||x===undefined)return 1;if(y===null||y===undefined)return -1;return(x>y?1:-1)*SORT_DIR})}
  const head=cols.map(c=>'<th onclick="sortBy(\''+esc(c)+'\')">'+esc(c)+(SORT_COL===c?'<span class="ar">'+(SORT_DIR>0?'▲':'▼')+'</span>':'')+'</th>').join('');
  const body=rows.map(r=>'<tr>'+cols.map(c=>{const s=cellStr(r[c]);return s===null?'<td class="null">null</td>':'<td title="'+esc(s)+'">'+esc(s)+'</td>'}).join('')+'</tr>').join('');
  return'<div class="gwrap"><table class="grid"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function exploreTab(){

  const tlist='<div class="tlist"><div class="th">테이블 ('+tables.length+')</div>'
    +(EXP&&EXP.error?'<p class="err" style="padding:8px">'+esc(EXP.error)+'</p>':'')
    +tables.map(t=>'<div class="trow'+(SEL_TABLE===t.table_name?' on':'')+'" onclick="pickTable(\''+esc(t.table_name)+'\')"><span class="tn">'+esc(t.table_name)+'</span><span class="tc">'+N(t.approx_rows)+'</span></div>').join('')
    +(EXP_BUSY?'<p class="muted" style="padding:8px">불러오는 중…</p>':'')+'</div>';
  let right='<div class="qbox">';
  right+='<div style="display:flex;gap:6px;flex-wrap:wrap">'+QUICK.map((x,i)=>'<button class="chip" onclick="quick('+i+')">'+esc(x.l)+'</button>').join('')+'</div>';
  right+='<textarea class="sqlta" oninput="setSql(this.value)" spellcheck="false" placeholder="SELECT ... (읽기 전용)">'+esc(SQLTEXT)+'</textarea>';
  right+='<div class="qbar"><button onclick="runSql()"'+(SQL_BUSY?' disabled':'')+'>'+(SQL_BUSY?'실행 중…':'실행')+'</button>'
    +'<span class="meta">'+(SQLRES&&!SQLRES.error?N(SQLRES.rowCount)+'행 · '+SQLRES.ms+'ms':'읽기 전용 · 최대 1000행')+'</span></div>';
  if(SEL_TABLE&&SEL_COLS&&SEL_COLS.length){right+='<div class="cols">'+SEL_COLS.map(c=>'<span class="c"><b>'+esc(c.column_name)+'</b> <em>'+esc(c.data_type)+(c.is_nullable==='NO'?' ·NN':'')+'</em></span>').join('')+'</div>'}
  right+=(SQLRES?grid(SQLRES):'<p class="muted">테이블을 선택하거나 SQL을 실행하세요.</p>');
  right+='</div>';
  return'<div class="exp">'+tlist+right+'</div>';
}
// ── 검토함(법적 리스크 언어 수집) ──
let FLAGS=null,FLAGS_BUSY=false,FL_STATUS='pending',FL_CAT='all';
const CAT_LABEL={threat:'협박·살해예고',drugs:'마약',sexual_crime:'성범죄',weapon:'무기·폭발물',privacy:'개인정보'};
const CAT_COLOR={threat:'#c0362c',drugs:'#9a3412',sexual_crime:'#7857c9',weapon:'#b45309',privacy:'#4b5563'};
async function loadFlags(){if(FLAGS_BUSY)return;FLAGS_BUSY=true;if(LAST)render(LAST);
  try{FLAGS=await api({view:'flags',status:FL_STATUS,category:FL_CAT})}catch(e){FLAGS={error:String(e)}}

function setFlagFilter(k,v){if(k==='status')FL_STATUS=v;else FL_CAT=v;FLAGS=null;loadFlags()}
async function resolveFlag(id,status){

  FLAGS=null;await loadFlags();}

    +'<div class="kpis"><div class="kpi"><b>'+N(FLAGS.pendingTotal)+'</b><span>검토 대기</span></div>'

  // 필터바
  h+='<div class="fbar">'
    +'<div class="seg"><span class="segl">상태</span>'+[['pending','대기'],['reviewed','검토완료'],['dismissed','무시'],['actioned','조치'],['all','전체']].map(o=>'<button class="segb'+(FL_STATUS===o[0]?' on':'')+'" onclick="setFlagFilter(\'status\',\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</div>'
    +'<div class="seg"><span class="segl">유형</span><button class="segb'+(FL_CAT==='all'?' on':'')+'" onclick="setFlagFilter(\'cat\',\'all\')">전체</button>'+Object.keys(CAT_LABEL).map(c=>'<button class="segb'+(FL_CAT===c?' on':'')+'" onclick="setFlagFilter(\'cat\',\''+c+'\')">'+CAT_LABEL[c]+'</button>').join('')+'</div>'
    +'<span class="fcount">'+(FLAGS.flags||[]).length+'건</span></div>';
  // 목록
  const srcL={post:'게시물',comment:'댓글',dm:'DM'};
  h+=(FLAGS.flags||[]).length?FLAGS.flags.map(f=>'<div class="flag"><div class="fh">'
      +'<span class="cat" style="background:'+(CAT_COLOR[f.category]||'#4b5563')+'">'+(CAT_LABEL[f.category]||f.category)+'</span>'
      +'<span class="who">'+esc(f.nickname||(f.user_id?f.user_id.slice(0,8)+'…':'(알 수 없음)'))+'</span>'
      +'<span class="src">'+(srcL[f.source]||f.source)+'</span>'
      +(f.status!=='pending'?'<span class="tag2">'+esc(f.status)+'</span>':'')
      +'<span class="ft">'+rel(f.created_at)+' 전</span></div>'
      +'<div class="body">'+esc(f.content||'')+'</div>'
      +(f.matched&&f.matched.length?'<div class="mm">매칭: '+esc(f.matched.join(', '))+'</div>':'')
      +(f.status==='pending'?'<div class="row"><button class="okbtn" onclick="resolveFlag(\''+f.id+'\',\'reviewed\')">검토완료</button><button class="nobtn" onclick="resolveFlag(\''+f.id+'\',\'dismissed\')">무시</button><button class="nobtn" onclick="resolveFlag(\''+f.id+'\',\'actioned\')">조치함</button></div>':'')
      +'</div>').join(''):'<p class="muted">해당 조건의 항목이 없어요.</p>';

// ── 이미지 검수 그리드 탭 ──
// 792명 규모를 눈으로 훑는 화면. 서버는 view:'images'로 페이지당 60명 + 진행률(보유/큐)을 준다.
let IMG=null,IMG_BUSY=false,IMG_PAGE=0,IMG_SEL={},IMG_MSG='';
let IMGF={style:'all',gender:'all',nat:'all',genre:'all',has:'all',approved:'all'};
const GENRES=['학원','판타지','액션','로맨스','일상','이세계'];
async function loadImages(keepSel){
  if(IMG_BUSY)return;IMG_BUSY=true;if(LAST)render(LAST);
  try{IMG=await api({view:'images',page:IMG_PAGE,pageSize:60,filters:IMGF})}catch(e){IMG={error:String(e)}}
  if(!keepSel)IMG_SEL={};
  IMG_BUSY=false;if(LAST)render(LAST);
}
function setIF(k,v){IMGF[k]=v;IMG_PAGE=0;IMG_MSG='';loadImages()}
function imgPage(n){IMG_PAGE=Math.max(0,n);IMG_MSG='';loadImages();window.scrollTo(0,0)}
function iseg(label,cur,opts,key){return'<div class="seg"><span class="segl">'+label+'</span>'+opts.map(o=>'<button class="segb'+(cur===o.v?' on':'')+'" onclick="setIF(\''+key+'\',\''+o.v+'\')">'+esc(o.l)+'</button>').join('')+'</div>'}
// 선택 토글은 전체 리렌더 없이 DOM만 갱신(60장 이미지 재로딩 방지)
function selImg(id,el){
  if(IMG_SEL[id])delete IMG_SEL[id];else IMG_SEL[id]=1;
  const c=document.getElementById('ic_'+id);if(c)c.classList.toggle('on',!!IMG_SEL[id]);
  const n=document.getElementById('iseln');if(n)n.textContent=Object.keys(IMG_SEL).length;
}
function selAllImg(on){
  IMG_SEL={};
  if(on)(IMG&&IMG.rows||[]).forEach(r=>{IMG_SEL[r.id]=1});
  if(LAST)render(LAST);
}
function imgRow(id){return((IMG&&IMG.rows)||[]).find(x=>x.id===id)}
// slot: 1=프로필(아바타), 2~6=사진 슬롯. 사진 함수의 slots 파라미터와 같은 번호 체계.
function lbUrl(r,slot){return slot>1?((r.photos||[])[slot-1]||''):(r.image||'')}
function big(u){return String(u||'').replace(/width=\d+/,'width=900').replace(/height=\d+/,'height=1100').replace(/quality=\d+/,'quality=85')}
function lb(id,slot){
  const r=imgRow(id);if(!r)return;const u=simg(lbUrl(r,slot));if(!u)return;
  modalOpen=true;
  document.body.insertAdjacentHTML('beforeend','<div class="lb" id="lb" onclick="if(event.target.id==\'lb\')closeLb()">'
    +'<img src="'+big(u)+'">'
    +'<div class="lbc">'+esc(r.name||'')+' · '+(slot>1?'사진 '+slot:'프로필')+' · '+(r.approved?'배포됨':'배포 대기')+'</div>'
    +'<div class="lbb"><button class="pri" onclick="regenOne(\''+id+'\',\''+(slot>1?'photos':'avatar')+'\','+(slot>1?slot:0)+',true)">이 이미지 재생성</button>'
    +'<button onclick="closeLb()">닫기</button></div></div>');
}
function closeLb(){modalOpen=false;const e=document.getElementById('lb');if(e)e.remove()}
async function approveImg(id,ok){
  try{await api({action:ok?'approve_persona':'reject_persona',id})}catch(e){alert('실패: '+e);return}
  IMG_MSG=(ok?'배포':'거부')+' 처리했어요.';
  await loadImages(true);
}
// 재생성은 즉시 그리는 게 아니라 ai_jobs 큐에 넣는다(이미지 1장 수십 초 → 엣지 동기 처리 불가).
async function regenOne(id,kind,slot,fromLb){
  const r=imgRow(id);
  if(!confirm((r?r.name:'')+' — '+(kind==='photos'?(slot?'사진 '+slot+'번':'사진'):'프로필')+'을(를) 재생성 큐에 넣을까요? (장당 약 $0.04)'))return;
  try{await api({action:'regen_images',id,kind,slots:(kind==='photos'&&slot)?[slot]:undefined})}catch(e){alert('실패: '+e);return}
  if(fromLb)closeLb();
  IMG_MSG='재생성 큐에 넣었어요. 워커가 처리하면 이미지가 바뀝니다.';
  await loadImages(true);
}
async function bulkImg(action){
  const ids=Object.keys(IMG_SEL);
  if(!ids.length){alert('선택된 페르소나가 없어요.');return}
  const label={approve:'배포',reject:'거부(비공개)',avatar:'프로필 재생성',photos:'사진 재생성'}[action];
  const cost=(action==='avatar'||action==='photos')?' 이미지 '+ids.length+'장 ≈ $'+(ids.length*0.04).toFixed(2)+'.':'';
  if(!confirm(ids.length+'명을 '+label+'할까요?'+cost))return;
  try{
    if(action==='approve')await api({action:'approve_persona',ids});
    else if(action==='reject')await api({action:'reject_persona',ids});
    else await api({action:'regen_images',ids,kind:action==='photos'?'photos':'avatar'});
  }catch(e){alert('실패: '+e);return}
  IMG_MSG=ids.length+'명 '+label+' 완료.';
  IMG_SEL={};await loadImages();
}
function imagesTab(){
  if(!IMG&&!IMG_BUSY)loadImages();
  if(!IMG)return'<p class="muted">이미지 불러오는 중…</p>';
  if(IMG.error)return'<p class="err">불러오기 실패: '+esc(IMG.error)+'</p>';
  const st=IMG.stats||{},tot=st.personasTotal||0;
  const pct=tot?Math.round((st.haveAvatar||0)/tot*100):0;
  let h='<div class="panel"><h2>이미지 검수</h2><p class="muted">생성된 프로필·사진을 한눈에 보고 <b>배포/거부</b>하거나, 마음에 안 드는 이미지를 <b>재생성</b>해요. 재생성은 큐에 들어가고 워커가 순서대로 처리해요(즉시 바뀌지 않아요).</p>'
    +'<div class="kpis">'+kpi(N(st.haveAvatar||0)+' / '+N(tot),'프로필 생성',pct+'%')
    +kpi(N(st.havePhotos||0),'사진 세트 보유')+kpi(N(st.qPending||0),'생성 대기 큐')
    +kpi(N(st.qDone||0),'생성 완료')+kpi(N(st.qFailed||0),'실패')+'</div>'
    +'<div class="prog"><div class="progf" style="width:'+pct+'%"></div></div></div>';
  h+='<div class="fbar">'
    +iseg('유형',IMGF.style,[{v:'all',l:'전체'},{v:'real',l:'실사'},{v:'anime',l:'🎨 애니'}],'style')
    +iseg('성별',IMGF.gender,[{v:'all',l:'전체'},{v:'female',l:'여성'},{v:'male',l:'남성'}],'gender')
    +(IMGF.style==='anime'
       ?iseg('장르',IMGF.genre,[{v:'all',l:'전체'}].concat(GENRES.map(g=>({v:g,l:g}))),'genre')
       :iseg('국적',IMGF.nat,[{v:'all',l:'전체'},{v:'korean',l:'🇰🇷 한국'},{v:'japanese',l:'🇯🇵 일본'},{v:'chinese',l:'🇨🇳 중국'},{v:'western',l:'🇺🇸 서구'}],'nat'))
    +iseg('이미지',IMGF.has,[{v:'all',l:'전체'},{v:'yes',l:'있음'},{v:'no',l:'없음'},{v:'nophoto',l:'사진 없음'}],'has')
    +iseg('배포',IMGF.approved,[{v:'all',l:'전체'},{v:'no',l:'대기'},{v:'yes',l:'배포됨'}],'approved')
    +'<span class="fcount">'+N(IMG.total||0)+'명 · '+((IMG.page||0)+1)+'페이지</span></div>';
  const allOn=(IMG.rows||[]).length>0&&(IMG.rows||[]).every(r=>IMG_SEL[r.id]);
  h+='<div class="ibar"><label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer"><input type="checkbox" '+(allOn?'checked':'')+' onchange="selAllImg(this.checked)"> 이 페이지 전체</label>'
    +'<span class="sel">선택 <span id="iseln">'+Object.keys(IMG_SEL).length+'</span>명</span>'
    +'<button class="pri" onclick="bulkImg(\'approve\')">일괄 배포</button>'
    +'<button class="dng" onclick="bulkImg(\'reject\')">일괄 거부</button>'
    +'<button onclick="bulkImg(\'avatar\')">프로필 재생성</button>'
    +'<button onclick="bulkImg(\'photos\')">사진 재생성</button>'
    +'<button onclick="loadImages(true)">새로고침</button>'
    +(IMG_MSG?'<span class="muted" style="font-size:12px">'+esc(IMG_MSG)+'</span>':'')+'</div>';
  const cards=(IMG.rows||[]).map(p=>{
    const img=simg(p.image);
    const ph=(p.photos||[]).slice(1,6);
    let strip='';
    for(let i=0;i<5;i++){const u=simg(ph[i]);strip+=u?'<img src="'+u+'" loading="lazy" onclick="lb(\''+p.id+'\','+(i+2)+')">':'<div class="ne"></div>'}
    const tags=(p.style==='anime'?'🎨 '+esc(p.genre||'애니'):(NAT_LABEL[p.nationality]||''))+(p.gender?' · '+(GEN_LABEL[p.gender]||''):'');
    return'<div class="icard'+(IMG_SEL[p.id]?' on':'')+'" id="ic_'+p.id+'">'
      +'<input type="checkbox" class="icheck"'+(IMG_SEL[p.id]?' checked':'')+' onchange="selImg(\''+p.id+'\',this)">'
      +'<span class="ibadge'+(p.approved?' ok':'')+'">'+(p.approved?'배포':'대기')+'</span>'
      +'<div class="iw"'+(img?' onclick="lb(\''+p.id+'\',1)"':'')+'>'+(img?'<img src="'+img+'" loading="lazy">':'<div class="noimg">이미지 없음</div>')+'</div>'
      +'<div class="ib"><div class="inm">'+esc(p.name||'')+(p.by_user?' <span class="tag2">유저</span>':'')+'</div><div class="imeta">'+tags+'</div></div>'
      +'<div class="ips">'+strip+'</div>'
      +'<div class="ibtns">'+(p.approved
        ?'<button class="no" onclick="approveImg(\''+p.id+'\',false)">거부</button>'
        :'<button class="ok" onclick="approveImg(\''+p.id+'\',true)">배포</button>')
      +'<button onclick="regenOne(\''+p.id+'\',\'avatar\',0)">↻프로필</button>'
      +(img?'<button onclick="regenOne(\''+p.id+'\',\'photos\',0)">↻사진</button>':'')
      +'</div></div>';

  h+='<div class="igrid">'+cards+'</div>';
  const pages=Math.max(1,Math.ceil((IMG.total||0)/(IMG.pageSize||60)));
  h+='<div class="pager"><button onclick="imgPage('+((IMG.page||0)-1)+')"'+((IMG.page||0)<=0?' disabled':'')+'>이전</button>'
    +'<span>'+((IMG.page||0)+1)+' / '+pages+'</span>'
    +'<button onclick="imgPage('+((IMG.page||0)+1)+')"'+((IMG.page||0)>=pages-1?' disabled':'')+'>다음</button></div>';
  return h;
}
function setTab(t){TAB=t;if(t==='이미지'&&!IMG)loadImages();if(t==='검수'&&!AUDIT)loadAudit();if(t==='배포'&&!PEND)loadPending();if(t==='학습'&&!TRAIN)loadTraining();if(t==='탐색'&&!EXP)loadExplore();if(t==='검토함'&&!FLAGS)loadFlags();if(LAST)render(LAST)}
function render(d){
  const tabs=['분석','탐색','배포','검토함','게시물','유저','페르소나','이미지','검수','학습'];
  const cnt={'게시물':(d.posts||[]).length,'유저':(d.users||[]).length,'페르소나':(d.personas||[]).length,'검수':AUDIT?(AUDIT.stats||{}).pending:null,'배포':PEND?((PEND.pendingPosts||0)+(PEND.pendingPersonas||0)):null,'학습':TRAIN?(TRAIN.pairs||{}).total:null,'탐색':EXP&&EXP.tables?EXP.tables.length:null,'검토함':FLAGS?FLAGS.pendingTotal:null,'이미지':IMG?IMG.total:null};
  let body=TAB==='분석'?analytics(d):TAB==='탐색'?exploreTab():TAB==='배포'?pendingTab():TAB==='검토함'?flagsTab():TAB==='게시물'?postsTab(d):TAB==='유저'?usersTab(d):TAB==='이미지'?imagesTab():TAB==='검수'?auditTab():TAB==='학습'?trainingTab():personasTab(d);
  document.getElementById('app').innerHTML='<div class="wrap"><div class="live"><span class="dot"></span>실시간 · '+new Date().toLocaleTimeString('ko')+' 갱신</div>'
    +'<div class="tabs">'+tabs.map(t=>'<div class="tab'+(TAB===t?' on':'')+'" onclick="setTab(\''+t+'\')">'+t+(cnt[t]!=null?' ('+cnt[t]+')':'')+'</div>').join('')+'</div>'+body+'</div>';
}
async function refresh(){if(modalOpen)return;
  // 승인/검수/학습 탭은 자체 데이터로 렌더 — 12초 전체 리렌더가 업로드 폼 입력을 지우지 않게 스킵.
  if(TAB==='배포'||TAB==='검수'||TAB==='학습'||TAB==='탐색'||TAB==='검토함'||TAB==='이미지'){try{LAST=await api({})}catch(_){/*무시*/}return;}
  try{const d=await api({});LAST=d;render(d)}catch(e){if(e==='forbidden'){document.getElementById('app').innerHTML='<div class="login"><h1>접근 불가</h1><p class="muted">관리자 계정이 아니에요.</p></div>';clearInterval(timer)}else if(e==='unauth'){sessionStorage.removeItem('mv_at');location.reload()}}}
function start(){refresh();clearInterval(timer);timer=setInterval(refresh,12000)}
if(TOKEN)start();
